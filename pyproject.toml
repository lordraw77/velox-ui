[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velox-ui"
version = "0.1.4"
description = "A fast, self-hosted frontend for local and remote LLMs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "velox-ui contributors" }]
keywords = ["llm", "ollama", "llama.cpp", "chat", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "fastapi>=0.115",
  "granian>=1.7",
  "msgspec>=0.19",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "httpx[http2]>=0.28",
  # Plain pydantic, deliberately not pydantic[email]: velox-ui validates addresses
  # itself because a strict RFC validator rejects the internal domains self-hosted
  # instances actually live on (see velox_ui.api.schemas.fields). Leaving
  # email-validator installed is not harmless — FastAPI imports it on sight, costing
  # roughly 25 ms of every process start.
  "pydantic>=2.9",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "cryptography>=43.0",
  "prometheus-client>=0.21",
  "python-multipart>=0.0.18",
  # sqlite-vec: the default vector store (ADR-0011). A loadable extension, ~1 MB,
  # no compiled numpy stack of its own — safe to keep in the base image.
  "sqlite-vec>=0.1.9",
  # Pure-Python PDF text extraction for RAG document ingestion. No native deps.
  "pypdf>=5.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
uvicorn = ["uvicorn[standard]>=0.32"]
# The local embedding default (ADR-0010). Kept out of the base image: onnxruntime
# and its transitive deps add tens of MB against a 250 MB image budget, and most
# self-hosted instances that never create a RAG collection should not pay for it.
# `rag/embedders/registry.py` raises a clear ImportError-derived message if a
# `fastembed:` collection is used without this extra installed.
rag = ["fastembed>=0.7"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "ruff>=0.8",
  "types-pyyaml",
]

[project.scripts]
velox = "velox_ui.cli:main"

# Builtin plugins (ADR-0014), registered the same way a third-party plugin would be.
# Both are disabled by default; discovery reads only this metadata, never importing
# the target until a plugin is enabled and actually used (`plugins/loader.py`).
[project.entry-points."velox_ui.images"]
builtin-images = "velox_ui.plugins.builtin.images:OpenAICompatImagePlugin"

[project.entry-points."velox_ui.voice"]
builtin-voice = "velox_ui.plugins.builtin.voice:OpenAICompatVoicePlugin"

# The tools group is plural: every registered plugin contributes its tools to a
# turn. The date/time one needs no configuration at all; websearch offers nothing
# until a SearXNG address is set.
[project.entry-points."velox_ui.tools"]
builtin-datetime = "velox_ui.plugins.builtin.datetime_tools:DateTimeToolPlugin"
builtin-websearch = "velox_ui.plugins.builtin.websearch:SearxngToolPlugin"

[project.urls]
Homepage = "https://github.com/lordraw77/velox-ui"
Documentation = "https://github.com/lordraw77/velox-ui/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/velox_ui"]
# The compiled interface travels in the wheel, so `pip install velox-ui` yields a
# working web UI with no Node involved at any point.
artifacts = ["src/velox_ui/web/**"]

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",
  "ASYNC",            # async correctness
  "S",                # bandit
  "D",                # pydocstyle
  "ANN",              # missing annotations
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN401", # Any is deliberate in a few escape hatches
  # The error taxonomy uses noun-phrase names on purpose: ContextOverflow,
  # ModelLoading and OutOfMemory read as the condition they describe, and an
  # "Error" suffix on every one of them adds noise without information.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D", "ANN"]  # fixtures hold fake credentials by design
"bench/**" = ["S", "D", "ANN", "ASYNC220", "ASYNC240"]  # benchmarks must start real processes
"src/velox_ui/db/migrations/**" = ["D", "ANN", "N"]
# Table names are string-interpolated because neither dialect parametrizes identifiers;
# vector_table_name() is the injection guard (rejects anything but a 26-char ULID),
# not the noqa comment bandit's S608 would otherwise want on every statement here.
"src/velox_ui/rag/store/*.py" = ["S608"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/velox_ui"]
plugins = []
warn_unreachable = true
disallow_any_explicit = false

# Optional dependencies that ship no stubs. Installing them to type-check a lazy
# `from fastembed import ...` inside one function would put onnxruntime in the lint
# job for nothing: `rag/embedders/fastembed_onnx.py` holds the model as `Any` anyway.
[[tool.mypy.overrides]]
module = ["granian.*", "sqlite_vec.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "contract: provider contract tests against fake backends",
  "bench: performance gate, run by bench/harness.py",
]
