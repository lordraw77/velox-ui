# Alembic configuration.
#
# The database URL is not set here: it comes from velox-ui's own configuration, so a
# migration can never be pointed at a different database than the application. Running
# `alembic` directly still works; env.py reads VELOX_DB_URL / velox.toml the same way
# the server does.

[alembic]
script_location = src/velox_ui/db/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
