# velox-ui with two MCP servers behind two gateway sidecars.
#
#   docker compose -f docker-compose.mcp-multi.yml up -d --build
#
# One gateway container runs exactly one MCP server, so N servers means N containers.
# They all use the same image, with every engine in it -- npx, uvx, bunx, deno, python
# -- and differ only in `command`, which is the server's own command line. Adding a
# third server is a new service block, not a build. All of them listen on 8000,
# because none publishes a port: on the compose network the service name is what tells
# them apart.
#
# Register them in velox-ui as two http_sse servers. The URLs, with nothing around
# them:
#
#   http://discogs-mcp:8000/mcp
#   http://justwatch-mcp:8000/mcp
#
# velox-ui merges their tools: GET /api/tools is the union over the caller's enabled
# servers (ADR-0020). A sidecar that dies takes down only its own tools.
#
# Tokens and hosts come from the .env file next to this one, which docker compose
# loads automatically and .gitignore keeps out of the repository.

# Everything the gateways have in common.
x-mcp-gateway: &mcp-gateway
  image: lordraw/velox-ui-mcp-gateway:latest
  build:
    context: .
    dockerfile: docker/mcp-gateway/Dockerfile
  restart: unless-stopped
  volumes:
    # One cache for every gateway and every engine. The first start of a server
    # downloads it; later starts, and other gateways sharing a dependency, reuse it.
    - mcp-cache:/cache
  # Deliberately no `ports`: a gateway has no authentication of its own, so it stays
  # on the compose network where only velox-ui can reach it.
  expose:
    - "8000"

services:
  velox-ui:
    image: velox-ui:latest
    # Comment `image` and uncomment `build` to run from a source checkout.
    build: .
    container_name: velox-ui
    restart: unless-stopped
    ports:
      - "9080:8080"
    volumes:
      - velox-data:/data
    environment:
      VELOX_LOG_FORMAT: json
      VELOX_PROVIDER_OLLAMA_HOSTS: ${OLLAMA_HOSTS}
      VELOX_PROVIDER_NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    env_file:
      - .env
    depends_on:
      - discogs-mcp
      - justwatch-mcp
      - searxng

  # An npm-published server, with a credential.
  discogs-mcp:
    <<: *mcp-gateway
    container_name: discogs-mcp
    command: ["npx", "-y", "discogs-mcp-server@0.5.7"]
    environment:
      DISCOGS_PERSONAL_ACCESS_TOKEN: ${DISCOGS_PERSONAL_ACCESS_TOKEN}

  # A PyPI-published server, no credential.
  #
  # `uvx mcp-justwatch==0.0.1`, not the `uvx mcp-justwatch python -m
  # mcp_justwatch.server` a desktop config for it sometimes carries: the package's
  # console script already is `mcp_justwatch.server:main`, and the trailing
  # `python -m ...` only reaches the script as arguments it ignores.
  #
  # No JUSTWATCH_COUNTRY / JUSTWATCH_LANGUAGE on purpose. Version 0.0.1 reads neither:
  # country and language are per-call tool arguments defaulting to US/en, so the model
  # passes "IT"/"it" per call. Setting them here would look like configuration while
  # changing nothing.
  justwatch-mcp:
    <<: *mcp-gateway
    container_name: justwatch-mcp
    command: ["uvx", "mcp-justwatch==0.0.1"]

  # Not an MCP server, and deliberately not behind a gateway: velox-ui talks to
  # SearXNG directly through its builtin `searxng-websearch` plugin, which calls
  # /search?format=json and provides `web_search` and `web_browse` -- the latter with
  # its own SSRF checks. Running an MCP SearXNG server through the gateway as well
  # would put two search tools in front of the model that do the same thing.
  #
  # Enable it once, as an administrator:
  #
  #   PUT /api/plugins/tools  {"enabled": true, "base_url": "http://searxng:8080"}
  #
  # docker/searxng/settings.yml explains the three settings it cannot run without.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      # Required: the mounted settings file carries no key, and SearXNG refuses to start
      # on its default one.
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      # Read-only, so the container cannot rewrite committed configuration. The image's
      # entrypoint tries to chown it anyway and logs "Read-only file system"; that line
      # is expected and harmless.
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    # No `ports`, same reasoning as the gateways: the limiter is off, so a published
    # SearXNG is an open search proxy for whoever can reach it.
    expose:
      - "8080"

volumes:
  velox-data:
  mcp-cache:
