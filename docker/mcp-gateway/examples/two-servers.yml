# Two MCP servers, two gateways, one image.
#
#   docker compose -f two-servers.yml up -d
#
# One supergateway process bridges exactly one stdio server: N servers means N
# containers, not one container with a server list. They share an image and all listen
# on 8000 internally; the published ports are what tells them apart from outside.
#
# In velox-ui they are two separate http_sse servers, and their tools merge --
# GET /api/tools is the union over the caller's enabled servers (ADR-0020). One
# gateway dying removes only its own tools.
#
#   http://<host>:8811/mcp   discogs
#   http://<host>:8812/mcp   justwatch
#
# See one-server.yml for why the port mappings start with 127.0.0.1.
x-mcp-gateway: &mcp-gateway
  image: my-mcp-gateway:latest
  build:
    context: .
    dockerfile: Dockerfile.derived
  restart: unless-stopped

services:
  # An npm-published server, with a credential.
  discogs-mcp:
    <<: *mcp-gateway
    container_name: discogs-mcp
    ports:
      - "127.0.0.1:8811:8000"
    command:
      - --stdio
      - discogs-mcp-server
      - --outputTransport
      - streamableHttp
      - --stateful
      - --sessionTimeout
      - "600000"
      - --port
      - "8000"
    environment:
      DISCOGS_PERSONAL_ACCESS_TOKEN: ${DISCOGS_PERSONAL_ACCESS_TOKEN}

  # A PyPI-published server, installed with uv, no credential.
  #
  # The command is the console script the package declares
  # (mcp-justwatch = mcp_justwatch.server:main), not `uvx mcp-justwatch python -m
  # mcp_justwatch.server`: a trailing `python -m ...` is passed to the script as
  # arguments it ignores, and `uvx` would re-resolve the package on every start.
  #
  # No JUSTWATCH_COUNTRY / JUSTWATCH_LANGUAGE here on purpose: version 0.0.1 reads
  # neither. Country and language are per-call tool arguments defaulting to US/en, so
  # the model passes "IT"/"it" per call. Setting them as environment variables would
  # look like configuration while changing nothing.
  justwatch-mcp:
    <<: *mcp-gateway
    container_name: justwatch-mcp
    ports:
      - "127.0.0.1:8812:8000"
    command:
      - --stdio
      - mcp-justwatch
      - --outputTransport
      - streamableHttp
      - --stateful
      - --sessionTimeout
      - "600000"
      - --port
      - "8000"
