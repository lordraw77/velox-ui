# Several MCP servers, one image, no build.
#
#   docker compose -f two-servers.yml up -d
#
# One gateway container runs exactly one server: N servers means N containers. They
# share the image and the cache volume, all listen on 8000 internally, and differ only
# in `command` and the published port.
#
# In velox-ui each is its own http_sse server, and their tools merge -- GET /api/tools
# is the union over the caller's enabled servers (ADR-0020). One gateway dying removes
# only its own tools.
#
#   http://<host>:8811/mcp   discogs     (npx)
#   http://<host>:8812/mcp   justwatch   (uvx)
#
# See one-server.yml for why the port mappings start with 127.0.0.1.
x-mcp-gateway: &mcp-gateway
  image: lordraw/velox-ui-mcp-gateway:latest
  restart: unless-stopped
  volumes:
    - mcp-cache:/cache

services:
  # npm-published, with a credential.
  discogs-mcp:
    <<: *mcp-gateway
    container_name: discogs-mcp
    command: ["npx", "-y", "discogs-mcp-server@0.5.7"]
    environment:
      DISCOGS_PERSONAL_ACCESS_TOKEN: ${DISCOGS_PERSONAL_ACCESS_TOKEN}
    ports:
      - "127.0.0.1:8811:8000"

  # PyPI-published, no credential.
  #
  # `uvx mcp-justwatch==0.0.1`, not `uvx mcp-justwatch python -m mcp_justwatch.server`:
  # the package's console script already is `mcp_justwatch.server:main`. And no
  # JUSTWATCH_COUNTRY / JUSTWATCH_LANGUAGE -- 0.0.1 reads neither; country and language
  # are per-call tool arguments the model passes.
  justwatch-mcp:
    <<: *mcp-gateway
    container_name: justwatch-mcp
    command: ["uvx", "mcp-justwatch==0.0.1"]
    ports:
      - "127.0.0.1:8812:8000"

  # The other engines take the same shape. Uncomment to try them:
  #
  # everything-bun:
  #   <<: *mcp-gateway
  #   command: ["bunx", "@modelcontextprotocol/server-everything@2026.8.31"]
  #   ports: ["127.0.0.1:8813:8000"]
  #
  # everything-deno:
  #   <<: *mcp-gateway
  #   command: ["deno", "run", "-A", "npm:@modelcontextprotocol/server-everything@2026.8.31"]
  #   ports: ["127.0.0.1:8814:8000"]

volumes:
  mcp-cache:
