# One MCP server behind one gateway, for a velox-ui that is already running elsewhere
# (another compose project, a bare-metal install, another host).
#
#   docker compose -f one-server.yml up -d
#
# No build: the published image carries every engine, and `command` names the server.
# Register it in velox-ui as an http_sse server. The URL, with nothing around it:
#
#   http://<host-reachable-address>:8811/mcp
#
# Unlike the sidecar layout in the repository's docker-compose.mcp.yml, this one does
# publish a port, because the client is not on this compose network. A published
# gateway is unauthenticated: bind it to an interface only velox-ui can reach, or put
# it behind the same reverse proxy and network policy as everything else. `127.0.0.1:`
# in the mapping below is that decision, not a placeholder -- drop it and the LAN can
# call every tool this server exposes.
services:
  discogs-mcp:
    image: lordraw/velox-ui-mcp-gateway:latest
    container_name: discogs-mcp
    restart: unless-stopped
    # The server's own command line, as an MCP client config spells it. Pinned: the
    # package is fetched at start, and an unpinned name is whatever is newest that day.
    command: ["npx", "-y", "discogs-mcp-server@0.5.7"]
    environment:
      DISCOGS_PERSONAL_ACCESS_TOKEN: ${DISCOGS_PERSONAL_ACCESS_TOKEN}
    volumes:
      - mcp-cache:/cache
    ports:
      - "127.0.0.1:8811:8000"

volumes:
  mcp-cache:
