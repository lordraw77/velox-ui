# velox-ui with one MCP server behind a gateway sidecar.
#
#   docker compose -f docker-compose.mcp.yml up -d
#
# The runtime image carries no Node and no package manager (ADR-0015), so an MCP server
# published on npm or PyPI cannot be started as a `stdio` server from inside it. The
# gateway image carries every engine -- npx, uvx, bunx, deno, python -- runs the server
# named by its `command`, and republishes it as Streamable HTTP, the transport
# `mcp/http_sse.py` speaks (ADR-0020). Changing server means changing `command`, not
# rebuilding anything. docs/mcp-gateway.md has the whole arrangement.
#
# Register it in velox-ui as an http_sse server -- no command, no args, only a URL. The
# URL, with nothing around it:
#
#   http://discogs-mcp:8000/mcp
#
# The token and the Ollama host come from the .env file next to this one, which docker
# compose loads automatically and .gitignore keeps out of the repository.

services:
  velox-ui:
    image: lordraw/velox-ui:latest
    # Comment `image` and uncomment `build` to run from a source checkout.
    build: .
    container_name: velox-ui
    restart: unless-stopped
    ports:
      - "9080:8080"
    volumes:
      - velox-data:/data
    environment:
      VELOX_LOG_FORMAT: json
      VELOX_PROVIDER_OLLAMA_HOSTS: ${OLLAMA_HOSTS}
      VELOX_PROVIDER_NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    env_file:
      - .env
    depends_on:
      - discogs-mcp

  discogs-mcp:
    image: lordraw/velox-ui-mcp-gateway:latest
    build:
      context: .
      dockerfile: docker/mcp-gateway/Dockerfile
    container_name: discogs-mcp
    restart: unless-stopped
    # The server's own command line, exactly as an MCP client config spells it. Pin the
    # version: the package is fetched at start, and an unpinned name is whatever is
    # newest that day.
    command: ["npx", "-y", "discogs-mcp-server@0.5.7"]
    environment:
      DISCOGS_PERSONAL_ACCESS_TOKEN: ${DISCOGS_PERSONAL_ACCESS_TOKEN}
    volumes:
      # npm, uv, bun and deno all cache under /cache: the first start downloads, every
      # later one starts in about a second.
      - mcp-cache:/cache
    # Deliberately no `ports`: the gateway has no authentication of its own, so it
    # stays on the compose network where only velox-ui can reach it.
    expose:
      - "8000"

volumes:
  velox-data:
  mcp-cache:
