# velox-ui together with a stdio→Streamable HTTP gateway for MCP servers.
#
#   docker compose -f docker-compose.mcp.yml up -d
#
# The runtime image carries no Node (see the Dockerfile's frontend stage and ADR-0015),
# so an MCP server published as an npm package cannot be started as a `stdio` server
# from inside the container -- `npx` does not exist there. The sidecar built by
# docker/mcp-gateway/Dockerfile runs that package and republishes it as Streamable
# HTTP, which is the transport `mcp/http_sse.py` implements (ADR-0020).
#
# Register it in velox-ui as an http_sse server -- no command, no args, only a URL
# reachable on this compose network. The URL, with nothing around it:
#
#   http://discogs-mcp:8000/mcp
#
# The token and the Ollama host come from the .env file next to this one, which docker
# compose loads automatically and .gitignore keeps out of the repository.

services:
  velox-ui:
    image: velox-ui:latest
    # Comment `image` and uncomment `build` to run from a source checkout.
    build: .
    container_name: velox-ui
    restart: unless-stopped
    ports:
      - "9080:8080"
    volumes:
      - velox-data:/data
    environment:
      VELOX_LOG_FORMAT: json
      VELOX_PROVIDER_OLLAMA_HOSTS: ${OLLAMA_HOSTS}
      VELOX_PROVIDER_NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    env_file:
      - .env
    depends_on:
      - discogs-mcp

  discogs-mcp:
    image: lordraw/velox-ui-mcp-gateway:latest
    build:
      context: .
      dockerfile: docker/mcp-gateway/Dockerfile
      args:
        NPM_PACKAGES: discogs-mcp-server@0.5.7
    container_name: discogs-mcp
    restart: unless-stopped
    # The server is already installed in the image, so this is the bare command, not
    # `npx -y discogs-mcp-server` -- npx would refetch a git-pinned dependency on every
    # start, which is exactly what the sidecar image exists to avoid.
    #
    # `--stateful` keeps one child process per session instead of spawning a fresh one
    # per request. A stateless gateway sends `tools/list` to a process that never saw
    # `initialize`, and a strict MCP server answers -32602. velox-ui holds the
    # `Mcp-Session-Id` the gateway returns (mcp/http_sse.py) and sends it back on every
    # later request, so the session is honoured.
    command:
      - --stdio
      - discogs-mcp-server
      - --outputTransport
      - streamableHttp
      - --stateful
      - --sessionTimeout
      - "600000"
      - --port
      - "8000"
    environment:
      DISCOGS_PERSONAL_ACCESS_TOKEN: ${DISCOGS_PERSONAL_ACCESS_TOKEN}
    # Deliberately no `ports`: the gateway speaks no authentication of its own, so it
    # stays on the compose network where only velox-ui can reach it.
    expose:
      - "8000"

volumes:
  velox-data:
