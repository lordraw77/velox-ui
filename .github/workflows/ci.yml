# Continuous integration.
#
# The performance suite runs here as a gate, not as a report: a regression past a
# stated target fails the build (ADR-0015). It uses deterministic local fixtures, so it
# needs no GPU, no network and no API key.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install -e '.[dev,postgres,uvicorn]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Type-check
        run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Enforce the bundle budget
        run: npm run size
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: src/velox_ui/web

  test:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv pip install -e '.[dev,postgres,uvicorn]'
      # The static-serving tests skip themselves without a build, so the suite passes
      # either way; running them for real is worth one artifact download.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web
          path: src/velox_ui/web
      - run: pytest

  server-matrix:
    # Both supported ASGI servers must actually boot and serve, or the uvicorn
    # fallback promised in ADR-0002 quietly stops being true.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [granian, uvicorn]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv pip install -e '.[dev,uvicorn]'
      - name: Start and probe
        env:
          VELOX_SERVER: ${{ matrix.server }}
          VELOX_DATA_DIR: ./ci-data
        run: |
          velox serve --port 8080 &
          for _ in $(seq 1 60); do
            sleep 0.5
            curl -sf http://127.0.0.1:8080/ready && break
          done
          curl -sf http://127.0.0.1:8080/ready
          curl -sf http://127.0.0.1:8080/api/version

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: velox-ui:latest
          load: true
      - name: Enforce the image size budget
        run: |
          BYTES=$(docker image inspect velox-ui:latest --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "image size: ${MB} MB (budget: 250 MB)"
          test "$MB" -le 250
      - name: Smoke test the container
        run: |
          docker run -d --name velox -p 8080:8080 velox-ui:latest
          for _ in $(seq 1 60); do
            sleep 0.5
            curl -sf http://127.0.0.1:8080/ready && break
          done
          curl -sf http://127.0.0.1:8080/ready

  mcp-gateway-image:
    # The companion image is published separately, so it needs its own build here or a
    # broken Dockerfile only surfaces when someone deploys it. No push: releases are
    # manual, same as the main image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp-gateway/Dockerfile
          tags: velox-ui-mcp-gateway:latest
          load: true
      - name: The three toolchains the image promises are present
        run: |
          docker run --rm --entrypoint sh velox-ui-mcp-gateway:latest -c \
            'node --version && npm --version && uv --version && git --version'
      - name: Bridge a real MCP server end to end
        run: |
          docker build -q -t gateway-smoke:latest - <<'DOCKERFILE'
          FROM velox-ui-mcp-gateway:latest
          USER root
          RUN npm install -g --no-audit --no-fund @modelcontextprotocol/server-everything@2026.8.31
          USER node
          DOCKERFILE
          docker run -d --name gateway-smoke -p 8000:8000 gateway-smoke:latest \
            --stdio mcp-server-everything \
            --outputTransport streamableHttp \
            --stateful --sessionTimeout 600000 \
            --port 8000
          for _ in $(seq 1 60); do
            sleep 0.5
            curl -sf -o /dev/null http://127.0.0.1:8000/mcp -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              && break
          done
          # A handshake that names the server, not just an HTTP 200: an empty stream
          # from a child that died is also a 200.
          curl -sS http://127.0.0.1:8000/mcp -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | tee /tmp/handshake.txt
          grep -q '"serverInfo"' /tmp/handshake.txt
      - name: Gateway logs
        if: failure()
        run: docker logs gateway-smoke

  bench:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web
          path: src/velox_ui/web
      - name: Run the performance gates
        run: python -m bench --json bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results.json
